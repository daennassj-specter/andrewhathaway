<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Collar Podcast CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --navy-deep:#0B2A3D;
  --navy:#123B54;
  --blueprint:#1B4F72;
  --paper:#F4F6F5;
  --paper-dim:#E7EBEA;
  --steel:#5C7A89;
  --ink:#0E1F29;
  --orange:#FF6A1A;
  --orange-dim:#FFE3D1;
  --line:#D7DEDD;
  --white:#FFFFFF;
  --green:#1F8A5F;
  --amber:#B9800A;
  --red:#C23B3B;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@font-face{font-family:'Barlow Condensed';src:local('Barlow Condensed');}
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c4cccb;border-radius:4px;}

#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:var(--navy-deep);color:#CFE0E8;background-image:
  linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size:22px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,0.1);}
.brand .stamp{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:0.5px;color:#fff;text-transform:uppercase;line-height:1.05;}
.brand .sub{font-family:var(--font-mono);font-size:10px;color:var(--orange);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
nav{padding:12px 10px;flex:1;}
.nav-group{margin-bottom:14px;}
.nav-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:#5D8296;padding:8px 10px 4px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;color:#B9CFDA;font-size:13.5px;font-weight:500;cursor:pointer;transition:.12s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(255,106,26,0.13);color:#fff;border-left:3px solid var(--orange);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:#3d5c6c;flex-shrink:0;}
.nav-item.active .dot{background:var(--orange);}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1);font-family:var(--font-mono);font-size:10.5px;color:#6E8FA0;}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
#topbar h1{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:0.3px;text-transform:uppercase;color:var(--navy-deep);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.search-box{position:relative;}
.search-box input{width:260px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:7px;background:var(--paper);}
.search-box::before{content:'⌕';position:absolute;left:11px;top:7px;color:var(--steel);font-size:15px;}
.btn{border:none;border-radius:7px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:#e85e10;}
.btn-outline{background:var(--white);border:1px solid var(--line);color:var(--navy-deep);}
.btn-outline:hover{background:var(--paper-dim);}
.btn-ghost{background:transparent;color:var(--steel);}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:#fff;border:1px solid #f0c4c4;color:var(--red);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

#content{flex:1;padding:24px 26px 60px;overflow-x:hidden;}
.view{display:none;}
.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* Cards */
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.section-title{font-family:var(--font-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.3px;color:var(--navy-deep);margin-bottom:12px;}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:20px;}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;transition:.12s;border-left:3px solid var(--steel);}
.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(11,42,61,0.08);}
.kpi .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--navy-deep);}
.kpi .lbl{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-top:2px;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* funnel */
.funnel-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;}
.funnel-row .flabel{width:150px;color:var(--ink);font-weight:600;flex-shrink:0;}
.funnel-bar-bg{flex:1;height:16px;background:var(--paper-dim);border-radius:4px;overflow:hidden;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--blueprint),var(--orange));}
.funnel-pct{width:44px;text-align:right;font-family:var(--font-mono);color:var(--steel);flex-shrink:0;}

/* Table */
.table-wrap{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1100px;}
th{text-align:left;padding:10px 12px;background:var(--paper);color:var(--steel);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
td{padding:9px 12px;border-bottom:1px solid var(--paper-dim);white-space:nowrap;}
tr.lead-row:hover{background:#FBFAF8;cursor:pointer;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;font-family:var(--font-mono);}
.pri-LOW{background:#EAF1F0;color:#3E7268;}
.pri-MEDIUM{background:#FFF3D9;color:var(--amber);}
.pri-HIGH{background:#FFE3D1;color:#C24A00;}
.pri-URGENT{background:#FCE0E0;color:var(--red);}
.qual-HOT{background:#FCE0E0;color:var(--red);}
.qual-STRONG{background:#FFE3D1;color:#C24A00;}
.qual-MEDIUM{background:#FFF3D9;color:var(--amber);}
.qual-LOW{background:#EAECEC;color:#6B7776;}
.status-chip{background:var(--paper-dim);color:var(--navy);padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.filter-bar select,.filter-bar input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--white);}

/* Kanban */
#kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;align-items:flex-start;}
.kcol{background:#EDF1F0;border-radius:10px;width:250px;flex-shrink:0;padding:10px;min-height:200px;}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.3px;color:var(--navy-deep);}
.kcol-count{background:var(--navy-deep);color:#fff;font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;border-radius:10px;}
.kcard{background:var(--white);border-radius:8px;padding:10px 11px;margin-bottom:8px;border:1px solid var(--line);border-left:3px solid var(--steel);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard .kname{font-weight:700;font-size:13px;color:var(--ink);}
.kcard .kbiz{font-size:11.5px;color:var(--steel);margin:1px 0 6px;}
.kcard .kmeta{display:flex;gap:5px;flex-wrap:wrap;}
.kcard .kmeta span{font-family:var(--font-mono);font-size:10px;background:var(--paper);padding:2px 6px;border-radius:4px;color:var(--navy);}
.kcol.dragover{outline:2px dashed var(--orange);outline-offset:-4px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,42,61,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:34px 16px;}
.modal{background:var(--white);border-radius:12px;width:100%;max-width:820px;max-height:calc(100vh - 68px);display:flex;flex-direction:column;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-body{padding:18px 22px;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:20px;color:var(--steel);}

/* form grid */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.form-field label{font-size:10.5px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.3px;}
.form-field input,.form-field select,.form-field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;width:100%;}
.form-field textarea{resize:vertical;min-height:50px;}
.fs-full{grid-column:1/-1;}

/* Tabs */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.tab-btn{padding:9px 14px;font-weight:600;font-size:12.5px;color:var(--steel);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab-btn.active{color:var(--navy-deep);border-bottom:2px solid var(--orange);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* activity */
.activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-dim);}
.activity-item .adot{width:8px;height:8px;border-radius:50%;background:var(--blueprint);margin-top:5px;flex-shrink:0;}
.activity-item .adate{font-family:var(--font-mono);font-size:10.5px;color:var(--steel);}
.activity-item .atext{font-size:12.5px;color:var(--ink);}

/* misc */
.empty-state{text-align:center;padding:50px 20px;color:var(--steel);}
.empty-state h3{font-family:var(--font-display);font-size:18px;color:var(--navy-deep);text-transform:uppercase;margin-bottom:6px;}
.tag-pill{background:var(--navy-deep);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:12px;font-weight:600;margin-right:3px;display:inline-block;margin-bottom:3px;}
.tag-pill.rm{cursor:pointer;}
.tag-pill.rm:after{content:' ×';}
#quick-add-fab{position:fixed;bottom:26px;right:26px;background:var(--orange);color:#fff;width:56px;height:56px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,106,26,0.4);z-index:50;border:none;}
.followup-group{margin-bottom:22px;}
.followup-group h3{font-family:var(--font-display);text-transform:uppercase;font-size:15px;color:var(--navy-deep);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.followup-group h3 .cnt{font-family:var(--font-mono);background:var(--paper-dim);padding:1px 8px;border-radius:10px;font-size:11px;}
.fu-card{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px;}
.fu-card.overdue{border-left:3px solid var(--red);}
.fu-card.today{border-left:3px solid var(--orange);}
.fu-card.upcoming{border-left:3px solid var(--green);}
.settings-list{list-style:none;}
.settings-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--paper-dim);}
.chk-row{display:flex;align-items:center;gap:14px;padding:8px 0;flex-wrap:wrap;}
input[type=checkbox]{width:15px;height:15px;}
.bulk-bar{position:sticky;top:0;background:var(--navy-deep);color:#fff;padding:9px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;}
.bulk-bar select,.bulk-bar button{margin-left:6px;}
.mono{font-family:var(--font-mono);}
.dim{color:var(--steel);}
.small{font-size:11.5px;}
.gen-loading{display:flex;align-items:center;gap:8px;color:var(--steel);padding:14px 0;font-size:12.5px;}
.spinner{width:14px;height:14px;border:2px solid var(--paper-dim);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.chat-msg{padding:9px 12px;border-radius:9px;margin-bottom:8px;font-size:12.5px;line-height:1.5;max-width:85%;}
.chat-msg.user{background:var(--navy-deep);color:#fff;margin-left:auto;}
.chat-msg.ai{background:var(--paper-dim);color:var(--ink);}
@media(max-width:900px){
  #sidebar{position:fixed;left:-220px;transition:.2s;z-index:200;}
  #sidebar.open{left:0;}
  .form-grid{grid-template-columns:1fr 1fr;}
  table{min-width:900px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="stamp">Blue Collar<br>Podcast</div>
      <div class="sub">Lead &amp; Guest CRM</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sync-status">● synced</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-right">
        <div class="search-box"><input id="global-search" placeholder="Search leads, business, email..."></div>
        <button class="btn btn-outline" id="export-btn">Export CSV</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<button id="quick-add-fab" title="Quick add lead">+</button>

<script>
/* ============ FIREBASE (real shared persistence) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyB4YmoPU2_prrO_pLT0YbMPZ_9uX8Ae_KA",
  authDomain: "blue-collar-podcast.firebaseapp.com",
  databaseURL: "https://blue-collar-podcast-default-rtdb.firebaseio.com",
  projectId: "blue-collar-podcast",
  storageBucket: "blue-collar-podcast.firebasestorage.app",
  messagingSenderId: "528183919653",
  appId: "1:528183919653:web:0a460544bf8cf53770ebcc"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();
// Drop-in replacement for the Claude-artifact window.storage API, backed by Firebase Realtime Database.
window.storage = {
  async get(key, shared){
    const snap = await fbDb.ref('crm/' + key).once('value');
    const val = snap.val();
    if(val === null || val === undefined) throw new Error('Key not found: ' + key);
    return { key, value: val, shared: !!shared };
  },
  async set(key, value, shared){
    await fbDb.ref('crm/' + key).set(value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await fbDb.ref('crm/' + key).remove();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    const snap = await fbDb.ref('crm').once('value');
    const val = snap.val() || {};
    const keys = Object.keys(val).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: !!shared };
  }
};

/* ============ CONSTANTS ============ */
const PIPELINE_MAIN = ["New Lead","Researched","Contacted","Follow-Up Needed","Responded","Interested","Qualified","Booking Requested","Booked","Podcast Completed"];
const PIPELINE_SIDE = ["Not Interested","Disqualified","No Response","Nurture / Follow Later"];
const ALL_STATUSES = [...PIPELINE_MAIN, ...PIPELINE_SIDE];

const DEFAULT_TRADES = {
  "Home Services":["Pest Control","HVAC","Plumbing","Electrical","Roofing","General Contracting","Remodeling","Restoration","Flooring","Painting","Landscaping","Tree Service","Pool Service","Garage Doors","Windows & Doors","Fencing","Concrete","Foundation","Excavation","Demolition","Insulation","Siding","Gutters","Pressure Washing","Cleaning","Junk Removal","Moving","Locksmith","Appliance Repair","Handyman","Home Security","Solar","Generators"],
  "Automotive":["Auto Repair","Collision Repair","Towing","Tire Shops","Auto Glass","Mobile Mechanics","Car Detailing","Fleet Services","Diesel Repair"],
  "Commercial / Industrial":["Commercial HVAC","Industrial Electrical","Industrial Plumbing","Commercial Roofing","Welding","Fabrication","Machine Shops","Manufacturing","Industrial Maintenance","Equipment Rental","Crane Services","Heavy Equipment","Commercial Cleaning","Facility Maintenance","Fire Protection","Security Services"]
};

const DEFAULT_TAGS = ["$5M+","Founder","CEO","Multi-Location","Family Business","High Growth","Great Story","Referral","Hot Lead","Follow Up","Podcast Prospect"];

const DEFAULT_SETTINGS = {
  qual: { rev1_3:10, rev3_5:20, rev5_10:30, rev10plus:40, owner:20, blueCollar:15, story:10, social:5, team:5, podcastFit:5 },

function icpExecRoleList(){ return (state.settings.icp.executiveRoles||"").split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); }
// Strict 3-factor ICP: $3M+ revenue AND blue-collar trade AND CEO/Founder/Owner-type title.
// Returns one of: 'QUALIFIED' | 'POTENTIAL' | 'NOT_ICP'
function icpStatus(l){
  const revText = (l.estimatedRevenue||"").trim();
  const revKnown = !!revText;
  const revNum = parseFloat(revText.replace(/[^0-9.]/g,''))||0;
  const revMet = revKnown && revNum >= (state.settings.icp.minRevenue||3);

  const tradeKnown = !!(l.trade && l.trade.trim());
  // Any trade present in our (admin-editable) blue-collar taxonomy counts as blue-collar.
  const tradeMet = tradeKnown;

  const titleKnown = !!(l.jobTitle && l.jobTitle.trim());
  const roles = icpExecRoleList();
  const titleMet = titleKnown && roles.some(r=>l.jobTitle.toLowerCase().includes(r));

  const anyDefinitivelyFailed = (revKnown && !revMet) || (titleKnown && !titleMet);
  const anyUnknown = !revKnown || !tradeKnown || !titleKnown;

  if(anyDefinitivelyFailed) return 'NOT_ICP';
  if(anyUnknown) return 'POTENTIAL';
  return 'QUALIFIED';
}
function icpBadgeHtml(status){

  const [txt,bg,fg] = map[status]||map.NOT_ICP;
  return `<span class="badge" style="background:${bg};color:${fg}">${txt}</span>`;
}

async function loadState(){
  try{
    const res = await window.storage.get('crm_data', true);
    if(res && res.value){ state = JSON.parse(res.value); }
    else { state = defaultState(); await persist(true); }
  }catch(e){ state = defaultState(); await persist(true); }
  // backfill missing fields for safety
  if(!state.generatedQueue) state.generatedQueue = [];
  if(!state.settings) state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if(!state.settings.icp) state.settings.icp = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.icp));
  if(state.settings.icp.titles && !state.settings.icp.executiveRoles){ state.settings.icp.executiveRoles = state.settings.icp.titles; }
  if(!state.podcastCategories) state.podcastCategories = JSON.parse(JSON.stringify(DEFAULT_PODCAST_CATEGORIES));
  const bh = state.podcastCategories.find(p=>p.id==='big-hitters'); if(bh && !bh.logoUrl) bh.logoUrl = LOGO_BIG_HITTERS;
  const bb = state.podcastCategories.find(p=>p.id==='builders-bible'); if(bb && !bb.logoUrl) bb.logoUrl = LOGO_BUILDERS_BIBLE;
  state.leads.forEach(l=>{ if(l.podcastCategoryId===undefined) l.podcastCategoryId=""; });
}
async function persist(immediate){
  document.getElementById('sync-status').textContent = '● saving…';
  clearTimeout(saveTimer);
  const doSave = async ()=>{
    try{
      await window.storage.set('crm_data', JSON.stringify(state), true);
      document.getElementById('sync-status').textContent = '● synced (shared)';
    }catch(e){
      document.getElementById('sync-status').textContent = '● save failed';
    }
  };
  if(immediate){ await doSave(); } else { saveTimer = setTimeout(doSave, 500); }
}

/* ============ HELPERS: computed ============ */
function leadName(l){ return `${l.firstName||''} ${l.lastName||''}`.trim() || '(no name)'; }
function qualBand(score){ if(score>=80) return "HOT"; if(score>=60) return "STRONG"; if(score>=40) return "MEDIUM"; return "LOW"; }
function computeScore(l){
  const q = state.settings.qual;
  let s = 0;
  const rev = parseFloat((l.estimatedRevenue||"0").replace(/[^0-9.]/g,''))||0;
  if(rev>=10) s+=q.rev10plus; else if(rev>=5) s+=q.rev5_10; else if(rev>=3) s+=q.rev3_5; else if(rev>=1) s+=q.rev1_3;
  if(l.businessOwner) s+=q.owner;
  if(l.blueCollarTrade) s+=q.blueCollar;
  if(l.story) s+=q.story;
  if(l.instagram||l.facebook||l.linkedin) s+=q.social;
  if(l.employees>=20) s+=q.team;
  if(l.podcastFit) s+=q.podcastFit;
  return Math.min(100,s);
}
function logActivity(l, text){ l.activity = l.activity||[]; l.activity.unshift({date:todayStr(), text, user:state.currentUser||"User"}); }

function filteredLeads(extra){
  let arr = state.leads.slice();
  const q = (document.getElementById('global-search')?.value||"").toLowerCase().trim();
  if(q){
    arr = arr.filter(l => [leadName(l),l.businessName,l.email,l.phone,l.trade,l.city,l.state].join(' ').toLowerCase().includes(q));
  }
  if(extra) arr = arr.filter(extra);
  return arr;
}

/* ============ DASHBOARD ============ */
function viewDashboard(){
  const L = state.leads;
  const count = st => L.filter(l=>l.status===st).length;
  const icpQualified = L.filter(l=>icpStatus(l)==='QUALIFIED').length;
  const icpPotential = L.filter(l=>icpStatus(l)==='POTENTIAL').length;
  const kpis = [
    ["Total Leads", L.length, null],
    ["ICP Qualified", icpQualified, "__icp_q"],
    ["ICP Potential", icpPotential, "__icp_p"],
    ["New Leads", count("New Lead"), "New Lead"],
    ["Contacted", count("Contacted"), "Contacted"],
    ["Follow-Ups Due", L.filter(l=>l.nextFollowUpDate && l.nextFollowUpDate<=todayStr()).length, "__fu"],
    ["Interested", count("Interested"), "Interested"],
    ["Qualified", count("Qualified"), "Qualified"],
    ["Booked", count("Booked"), "Booked"],
    ["Podcasts Completed", count("Podcast Completed"), "Podcast Completed"],
    ["No Response", count("No Response"), "No Response"],
    ["Disqualified", count("Disqualified"), "Disqualified"],
  ];
  const stageOf = s => PIPELINE_MAIN.indexOf(s);
  const reach = n => L.filter(l=>stageOf(l.status)>=n || ["Booking Requested","Booked","Podcast Completed"].includes(l.status) && n<=7).length;
  const totalN = L.length||1;
  const contactedN = L.filter(l=>stageOf(l.status)>=2).length;
  const respondedN = L.filter(l=>stageOf(l.status)>=4).length;
  const interestedN = L.filter(l=>stageOf(l.status)>=5).length;
  const qualifiedN = L.filter(l=>stageOf(l.status)>=6).length;
  const bookedN = L.filter(l=>stageOf(l.status)>=8).length;
  const completedN = L.filter(l=>l.status==="Podcast Completed").length;
  const pct = (a,b)=> b>0? Math.round(a/b*100):0;
  const funnel = [
    ["Lead → Contacted", pct(contactedN,totalN)],
    ["Contacted → Response", pct(respondedN,contactedN)],
    ["Response → Interested", pct(interestedN,respondedN)],
    ["Interested → Qualified", pct(qualifiedN,interestedN)],
    ["Qualified → Booked", pct(bookedN,qualifiedN)],
    ["Booked → Completed", pct(completedN,bookedN)],
    ["Overall Lead → Podcast", pct(completedN,totalN)],
  ];
  const bySource = {}; L.forEach(l=>{ bySource[l.source]=(bySource[l.source]||0)+1; });
  const byTrade = {}; L.forEach(l=>{ byTrade[l.trade]=(byTrade[l.trade]||0)+1; });
  window.__dashData = {bySource, byTrade, qual:{
    HOT:L.filter(l=>qualBand(l.qualificationScore)==='HOT').length,
    STRONG:L.filter(l=>qualBand(l.qualificationScore)==='STRONG').length,
    MEDIUM:L.filter(l=>qualBand(l.qualificationScore)==='MEDIUM').length,
    LOW:L.filter(l=>qualBand(l.qualificationScore)==='LOW').length
  }};

  return `
  <div class="kpi-grid">
    ${kpis.map(([lbl,num,fk])=>`<div class="kpi" data-fk="${fk||''}" onclick="kpiClick('${fk||''}')"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('')}
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="section-title">Conversion Funnel</div>
      ${funnel.map(([l,p])=>`<div class="funnel-row"><div class="flabel">${l}</div><div class="funnel-bar-bg"><div class="funnel-bar" style="width:${p}%"></div></div><div class="funnel-pct">${p}%</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="section-title">Outreach by Source</div>
      <canvas id="chartSource" height="200"></canvas>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="section-title">Leads by Trade</div>
      <canvas id="chartTrade" height="210"></canvas>
    </div>
    <div class="card">
      <div class="section-title">Qualification Mix</div>
      <canvas id="chartQual" height="210"></canvas>
    </div>
  </div>
  `;
}
function kpiClick(fk){
  if(!fk) { goTo('leads-all'); return; }
  if(fk==='__fu'){ goTo('leads-followups'); return; }
  if(fk==='__icp_q'){ goTo('leads-icp'); return; }
  if(fk==='__icp_p'){ dashFilter='__icp_potential'; goTo('leads-all'); return; }
  dashFilter = fk; goTo('leads-all');
}
function drawDashCharts(){
  if(!window.__dashData) return;
  const d = window.__dashData;
  const palette = ['#1B4F72','#FF6A1A','#5C7A89','#1F8A5F','#B9800A','#C23B3B','#0B2A3D'];
  const mk = (id,labels,data,type)=>{
    const el = document.getElementById(id); if(!el) return;
    new Chart(el, {type:type||'doughnut', data:{labels, datasets:[{data, backgroundColor:palette, borderWidth:type==='bar'?0:2, borderColor:'#fff'}]},
      options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10.5}}}}, ...(type==='bar'?{indexAxis:'y',scales:{x:{beginAtZero:true}}}:{})}});
  };
  mk('chartSource', Object.keys(d.bySource), Object.values(d.bySource));
  mk('chartTrade', Object.keys(d.byTrade), Object.values(d.byTrade), 'bar');
  mk('chartQual', Object.keys(d.qual), Object.values(d.qual));
}

  const s = document.getElementById('bulk-status').value; if(!s) return;
  state.leads.forEach(l=>{ if(selectedIds.has(l.id)){ l.status=s; logActivity(l,`Status bulk-changed to ${s}.`);} });

}
function bulkApplyTag(){
  const t = document.getElementById('bulk-tag').value; if(!t) return;
  state.leads.forEach(l=>{ if(selectedIds.has(l.id) && !l.tags.includes(t)) l.tags.push(t); });

function bulkDelete(){
  if(!confirm(`Delete ${selectedIds.size} lead(s)? This can't be undone.`)) return;
  state.leads = state.leads.filter(l=>!selectedIds.has(l.id));
  persist(); selectedIds.clear(); goTo('leads-all');
}

function viewFollowups(){
  const today = todayStr();
  const withFU = state.leads.filter(l=>l.nextFollowUpDate);
  const overdue = withFU.filter(l=>l.nextFollowUpDate<today);
  const dueToday = withFU.filter(l=>l.nextFollowUpDate===today);
  const upcoming = withFU.filter(l=>l.nextFollowUpDate>today);
  const noDate = state.leads.filter(l=>!l.nextFollowUpDate && !["Podcast Completed","Not Interested","Disqualified"].includes(l.status));
  const grp = (title,arr,cls)=> `<div class="followup-group"><h3>${title} <span class="cnt">${arr.length}</span></h3>
    ${arr.length? arr.map(l=>fuCard(l,cls)).join('') : `<div class="dim small" style="padding:6px 0">Nothing here.</div>`}</div>`;
  return grp("Overdue", overdue, "overdue") + grp("Due Today", dueToday, "today") + grp("Upcoming", upcoming, "upcoming") + grp("No Follow-Up Date Set", noDate, "");
}

let kanbanPodcastFilter = "";
function viewKanban(){
  const cols = [...PIPELINE_MAIN, ...PIPELINE_SIDE];
  const filterBar = `<div class="filter-bar">

    </select>
  </div>`;
  const inFilter = l => !kanbanPodcastFilter || (kanbanPodcastFilter==='__unassigned' ? !l.podcastCategoryId : l.podcastCategoryId===kanbanPodcastFilter);

        <div class="kbiz">${esc(l.businessName)}</div>
        <div class="kmeta">
          <span>${esc(l.trade)}</span>
          <span>${esc(l.estimatedRevenue||'—')}</span>
          <span class="badge pri-${l.priority}" style="font-family:inherit">${l.priority}</span>
        </div>
        <div class="small dim" style="margin-top:5px;display:flex;align-items:center;gap:5px">

function kdragstart(e,id){ draggedId=id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function kdrop(e,status){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const l = state.leads.find(x=>x.id===draggedId); if(!l) return;
  if(l.status!==status){ const old=l.status; l.status=status; logActivity(l,`Status changed: ${old} → ${status}.`);
    if(status==="Interested") l.podcast.interestedDate=todayStr();
    if(status==="Qualified") l.podcast.qualifiedDate=todayStr();
    if(status==="Booked") l.podcast.bookingDate=l.podcast.bookingDate||todayStr();
    if(status==="Podcast Completed") l.podcast.completedDate=todayStr();
    persist(); }
  goTo('kanban');
}

  const l = state.leads.find(x=>x.id===id);
  const g = (fid)=>document.getElementById(fid);
  const setIf = (fid,key,isNum,isChk)=>{ const el=g(fid); if(!el) return; l[key] = isChk? el.checked : (isNum? Number(el.value)||0 : el.value); };
  ['firstName','lastName','jobTitle','businessName','legalName','trade','city','state','country','website','email','phone','instagram','facebook','linkedin','status','priority','source','assignedTo','nextFollowUpDate','researchStatus','estimatedRevenue','revenueConfidence','verifiedRevenue','story','disqualificationReason','lastContactDate','lastContactMethod','podcastCategoryId'].forEach(k=>setIf('f-'+k,k,false,false));
  ['yearsInBusiness','employees','numFollowUps','qualificationScore'].forEach(k=>setIf('f-'+k,k,true,false));
  ['revenueQualified','businessOwner','blueCollarTrade','podcastFit'].forEach(k=>setIf('f-'+k,k,false,true));

async function runGenerator(){
  const revenue=document.getElementById('gen-revenue').value;
  const tradeSel=document.getElementById('gen-trade').value;
  const trade = tradeSel==='All Blue-Collar Trades' ? '' : tradeSel;
  const title=document.getElementById('gen-title').value;
  const country=document.getElementById('gen-country').value;
  const st=document.getElementById('gen-state').value;
  const stateFilter = st==='All States' ? '' : st;
  const podcastCategoryId = document.getElementById('gen-podcast-cat').value;
  let count=Math.min(10, Math.max(1, Number(document.getElementById('gen-count').value)||10)); // capped per run regardless of requested total
  const location = [stateFilter, country].filter(Boolean).join(', ') || country;
  const statusEl = document.getElementById('gen-status');
  statusEl.innerHTML = `<div class="gen-loading"><div class="spinner"></div> Searching the web for real ${esc(trade||'blue-collar')} CEOs/founders/owners in ${esc(location)} doing ${esc(revenue)}+…</div>`;
  try{
    const prompt = `You are a lead-research assistant for a podcast CRM. The Ideal Customer Profile (ICP) is STRICT and non-negotiable: businesses doing ${revenue}+ in annual revenue, operating in a blue-collar trade, run by a CEO, Founder, Owner, Co-Founder, President, or Managing Partner (priority order: Founder, CEO, Owner, Co-Founder, President, Managing Partner). Use web search to find REAL, currently-operating businesses matching:
Trade: ${trade||"any blue-collar trade"}
Location: ${location}
Minimum revenue: ${revenue}
Target role: ${title}
Count: ${count}

Rules:
- Only include businesses you can find real evidence for via search (company site, directory listing, news, LinkedIn, BBB, industry association, etc). Never invent a company or person.
- Do NOT include employees, sales/ops/marketing/office managers, or technicians — only CEO/Founder/Owner/Co-Founder/President/Managing Partner level contacts.
- Do NOT include businesses below the minimum revenue unless you cannot verify revenue at all — in that case include them but mark revenueConfidence "Unknown".
- If you cannot verify a detail (revenue, owner name, employee count), write "Unknown" rather than guessing, and set revenueConfidence to "Unknown" or "Low Confidence" accordingly. Only use "Verified" or "High Confidence" if a source clearly states it.
- Always include a sourceUrl for each lead pointing to where you found it.
- If you find fewer than ${count} genuinely verifiable businesses meeting the ICP, return fewer rather than padding with guesses.

Respond with ONLY a raw JSON array (no markdown fences, no prose), each item shaped exactly like:
{"name":"Full Name or Unknown","title":"","business":"","trade":"","tradeCategory":"","location":"City, ST","revenue":"e.g. $3.2M or Unknown","revenueConfidence":"Verified|High Confidence|Medium Confidence|Low Confidence|Unknown","website":"","sourceUrl":"","notes":"1-2 sentence summary of what you found and why it fits the ICP"}`;
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1500, messages:[{role:"user",content:prompt}], tools:[{type:"web_search_20250305",name:"web_search"}] })
    });
    const data = await resp.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\\n');
    let clean = textBlocks.replace(/```json|```/g,'').trim();
    const match = clean.match(/\\[[\\s\\S]*\\]/);
    const arr = JSON.parse(match? match[0] : clean);
    arr.forEach(g=>{ g.tradeCategory = g.tradeCategory || Object.keys(state.trades).find(k=>state.trades[k].includes(g.trade)) || Object.keys(state.trades)[0]; g.podcastCategoryId = podcastCategoryId||""; });
    state.generatedQueue.push(...arr);
    persist();
    statusEl.innerHTML = `<div style="color:var(--green);font-weight:600">✓ Found ${arr.length} candidate lead(s). <a href="#" onclick="goTo('leads-generated');return false;" style="color:var(--blueprint)">Review them in the queue →</a></div>`;
  }catch(e){
    statusEl.innerHTML = `<div style="color:var(--red)">Something went wrong reaching the research service. Try again, or narrow your criteria. (${esc(e.message||'')})</div>`;
  }
}

async function sendChat(){
  const inputEl = document.getElementById('chat-input');
  const q = inputEl.value.trim(); if(!q) return;
  chatHistory.push({role:'user',text:q}); inputEl.value='';
  chatHistory.push({role:'ai',text:'…thinking'});
  renderView();
  const summary = state.leads.map(l=>({name:leadName(l),business:l.businessName,trade:l.trade,city:l.city,state:l.state,revenue:l.estimatedRevenue,status:l.status,priority:l.priority,score:l.qualificationScore,nextFollowUp:l.nextFollowUpDate,source:l.source,tags:l.tags,podcastEpisode:l.podcast.episodeNumber})).slice(0,400);
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:`You are a CRM assistant for a podcast lead pipeline. Answer ONLY using the data below — never invent leads or facts not present here. Be concise and concrete (name specific leads when relevant). Today's date: ${todayStr()}.\\n\\nDATA:\\n${JSON.stringify(summary)}\\n\\nQUESTION: ${q}`}] })
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\\n') || "I couldn't generate a response — try rephrasing.";
    chatHistory[chatHistory.length-1] = {role:'ai',text};
  }catch(e){
    chatHistory[chatHistory.length-1] = {role:'ai',text:"I couldn't reach the assistant service. Please try again."};
  }
  renderView();
}

function exportCSV(){
  const cols = ["firstName","lastName","businessName","trade","city","state","estimatedRevenue","status","priority","qualificationScore","source","email","phone","nextFollowUpDate"];
  const rows = filteredLeads().map(l=>cols.map(c=>`"${(l[c]??'').toString().replace(/"/g,'""')}"`).join(','));
  const csv = cols.join(',')+"\\n"+rows.join('\\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='blue-collar-crm-leads.csv'; a.click();
}

/* ============ INIT ============ */
async function afterRender(){
  if(currentView==='dashboard') drawDashCharts();
  if(currentView==='podcast-category-detail') drawCatChart();
  renderBulkBar();
}
function drawCatChart(){
  const el = document.getElementById('chartCatTrade'); if(!el || !window.__catData) return;
  const palette = ['#1B4F72','#FF6A1A','#5C7A89','#1F8A5F','#B9800A','#C23B3B','#0B2A3D'];
  new Chart(el, {type:'bar', data:{labels:Object.keys(window.__catData), datasets:[{data:Object.values(window.__catData), backgroundColor:palette}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}});
}
async function init(){
  await loadState();
  renderNav();
  goTo('dashboard');
  document.getElementById('global-search').addEventListener('input', ()=>{ if(currentView==='leads-all') applyFilters(); });
  document.getElementById('export-btn').addEventListener('click', exportCSV);
  document.getElementById('quick-add-fab').addEventListener('click', openQuickAdd);
}
init();
</script>
